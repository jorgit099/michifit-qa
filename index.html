<title>MichiFit QA</title>
<!--
  MichiFit v3.3 · 2026-11-15
  Cambios respecto a v3.2:
  - Interfaz nueva (Inicio, Hoy, Ejercicio con marcador, cronometros, Progreso con 2 pestanas),
    un color por dia de rutina, tema claro fijo con boton para oscuro. Fuentes incluidas (sin internet).
  - Gym donde entrenas: se elige en Inicio; "la vez pasada", sugerencias y "Sube peso" usan solo ese gym.
    Gyms guardados: Fitness Center (todo lo anterior) y Perfect Body Gym.
  - Semana de rutina: cada entreno se asigna a su semana de rutina (no a la del calendario).
    RIR meta y Progreso salen de esa semana.
  - Semaforo de recuperacion por musculo (72/48 h grandes, 48/24 h chicos; +24 h si llegaste a RIR 0)
    y volumen semanal contra el plan (series indirectas cuentan la mitad).
  - Cambiar ejercicio: recomendacion segun lo que ya hiciste y lo que falta hoy, tus ejercicios escritos
    por dia, y nombres normalizados (mayusculas/acentos no duplican).
  - Cronometro real para plancha y cardio (sigue aunque bloquees el iPhone); aviso si no llegas a la meta.
  - Editar serie: cambiar peso corporal y "Por lado" por serie (al pasar a peso corporal se borran los kg).
  - "Marcar dia cerrado" (festivo) para ver cuantos dias pendientes te quedan contra dias disponibles.
  - Migracion automatica de datos al abrir (copia interna previa + aviso para respaldar).
  - Service worker: index.html se pide siempre sin cache (cache: 'no-store') para recibir versiones nuevas.
  Historial de versiones anteriores: ver MichiFit_v3_2/index.html.
-->

/* Una columna para celular. --acc / --hero / --onacc los pone el codigo segun el color del dia. */
:root{
  --bg:#F4F2FA;--card:#FFFFFF;--ink:#1F1B33;--muted:#5A5470;--line:#E4DFF0;--soft:#EEEAF7;
  --okbg:#DDF3E8;--okfg:#0E6B49;--wbg:#FFF0D1;--wfg:#7A4B00;--rbg:#FDE2E1;--rfg:#A3201E;
  --nav:#FFFFFF;--shadow:0 6px 18px rgba(20,10,60,.10);--shadow2:0 10px 28px rgba(20,10,60,.14);
  --acc:#5B3DF5;--hero:#5B3DF5;--onacc:#FFFFFF;--recap:#1F1B33;--alarm:#FF6B95;--onalarm:#2A0A18;
  --f-d:'Outfit','Avenir Next',system-ui,sans-serif;--f-b:'Jakarta','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15121F;--card:#221E33;--ink:#F1EEFA;--muted:#B9B2D0;--line:#352F4C;--soft:#2B2640;
  --okbg:#173A2C;--okfg:#7BE3B5;--wbg:#3D2E10;--wfg:#FFD27A;--rbg:#46191B;--rfg:#FF9C96;
  --nav:#1B1729;--shadow:none;--shadow2:0 10px 28px rgba(0,0,0,.35);--recap:#0E0B18;--alarm:#FF7FA4;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:16px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
.d{font-family:var(--f-d)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eb{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(max(env(safe-area-inset-bottom,0px),16px) + 120px);display:flex;flex-direction:column;gap:12px}
.wrap.ej{padding-bottom:calc(max(env(safe-area-inset-bottom,0px),16px) + 120px)}
.top{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qa{position:sticky;top:0;z-index:30;background:#FF6B95;color:#2A0A18;text-align:center;font-weight:800;letter-spacing:.12em;font-size:12px;padding:calc(env(safe-area-inset-top,0px) + 4px) 8px 4px}
.qa + .wrap .top,.qa + .wrap .hero{padding-top:14px}
/* Hero de color del dia */
.hero{margin:0 -16px;background:var(--hero);color:#FFFFFF;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 18px;border-radius:0 0 30px 30px;display:flex;flex-direction:column;gap:8px}
.hero.pad{padding-bottom:56px}
.hero .hb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .sub{font-size:14px;opacity:.94}
.hero h1{font-family:var(--f-d);font-weight:800;line-height:1}
.ibtn{width:44px;height:44px;flex-shrink:0;border:none;border-radius:22px;background:rgba(255,255,255,.2);color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn.lt{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 12px;border:none;border-radius:999px;background:rgba(255,255,255,.2);color:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer}
.pill[disabled]{opacity:.7;cursor:default}
.tag{align-self:flex-start;background:#FFFFFF;color:var(--hero);font-size:11px;font-weight:800;letter-spacing:.12em;padding:4px 10px;border-radius:999px}
.tiles{display:flex;gap:8px;margin-top:-42px;position:relative}
.tile{flex:1;min-width:0;background:var(--card);border-radius:18px;padding:9px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow);text-align:center}
.tile .v{font-family:var(--f-d);font-size:26px;font-weight:800;line-height:1;color:var(--acc)}
.tile .v small{font-size:13px;color:var(--muted)}
.tile .l{font-size:11px;font-weight:700;color:var(--muted);line-height:1.15}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.card.col{display:flex;flex-direction:column;gap:8px}
.sem{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.sem.ok{background:var(--okbg);color:var(--okfg)}.sem.w{background:var(--wbg);color:var(--wfg)}.sem.r{background:var(--rbg);color:var(--rfg)}
.sem i{font-style:normal;font-size:10px}
.alert{border-radius:14px;padding:9px 12px;display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;line-height:1.35}
.alert.w{background:var(--wbg);color:var(--wfg)}.alert.ok{background:var(--okbg);color:var(--okfg)}.alert.r{background:var(--rbg);color:var(--rfg)}
.fold{width:100%;min-height:48px;border:none;background:transparent;padding:0;display:flex;align-items:center;gap:8px;color:var(--ink);cursor:pointer;text-align:left}
.fold .t{font-family:var(--f-d);font-size:18px;font-weight:700}
.fold .s{flex:1;display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.fold .c{width:32px;height:32px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s}
.fold[aria-expanded="true"] .c{transform:rotate(180deg)}
.exrow{width:100%;text-align:left;border:none;border-top:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 0;cursor:pointer;color:var(--ink)}
.exrow:first-of-type{border-top:none}
.nb{flex-shrink:0;width:28px;height:28px;border-radius:14px;background:var(--acc);color:var(--onacc);font-family:var(--f-d);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.nb.ok{background:var(--okbg);color:var(--okfg)}
.exrow .m{flex:1;min-width:0;display:flex;flex-direction:column}
.exrow .m b{font-size:14px;font-weight:700}
.exrow .m span{font-size:12px;color:var(--muted)}
.exrow .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.exrow .r b{font-family:var(--f-d);font-size:15px;font-weight:700}
.bdg{font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;background:var(--okbg);color:var(--okfg)}
.bdg.p{background:var(--soft);color:var(--ink)}
.btn{width:100%;min-height:54px;border:none;border-radius:18px;background:var(--acc);color:var(--onacc);font-family:var(--f-d);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 14px}
.btn[disabled]{background:var(--soft);color:var(--muted);cursor:not-allowed}
.btn2{min-height:50px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font-family:var(--f-d);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 14px}
.btn2.w{width:100%}
.lnk{min-height:44px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chip{flex-shrink:0;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.chip.dash{border-style:dashed;color:var(--muted);background:transparent}
.chip.acc{border:1px dashed var(--acc);color:var(--acc);font-weight:800;background:transparent}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:3px}
.seg button{flex:1;min-height:40px;border:none;border-radius:11px;background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 2px 8px rgba(20,10,60,.10)}
/* Inicio */
.dayrow{width:100%;text-align:left;display:flex;align-items:stretch;min-height:64px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:0;color:var(--ink);cursor:pointer}
.dayrow.sug{border:3px solid var(--dcb)}
.dayrow.hecho{opacity:.62}
.dayrow[disabled]{opacity:.45;cursor:not-allowed}
.dayrow.ver{opacity:.8}
.dayrow.ver .g b{color:var(--muted)}
.dayrow .c{width:66px;flex-shrink:0;background:var(--dc);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;text-align:center}
.dayrow .c small{font-family:var(--f-d);font-size:11px;font-weight:700;opacity:.9}
.dayrow .c b{font-family:var(--f-d);font-size:15px;font-weight:800;line-height:1}
.dayrow .m{flex:1;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.dayrow .m span.x{font-size:12px;color:var(--muted);line-height:1.3}
.dayrow .g{padding-right:12px;display:flex;align-items:center;color:var(--muted)}
.dayrow .g b{font-family:var(--f-d);font-size:15px;font-weight:800;color:var(--dcb);display:flex;align-items:center;gap:2px}
.sugt{font-size:10px;font-weight:800;letter-spacing:.1em;color:#FFFFFF;background:var(--dc);border-radius:6px;padding:2px 6px}
/* Ejercicio */
.score{background:var(--card);border-radius:24px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow2);margin-top:-66px;position:relative}
.score .vs{display:flex;align-items:center}
.score .vs>div{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.score .big{font-family:var(--f-d);font-size:34px;font-weight:800;line-height:1.05;white-space:nowrap}
.score .sl{display:flex;align-items:center;gap:6px}
.score .sl .a{width:96px;text-align:right;font-family:var(--f-d);font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .sl .b{width:58px;font-family:var(--f-d);font-size:14px;font-weight:700;white-space:nowrap}
.score .sl .n{width:24px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.trk{flex:1;height:6px;border-radius:3px;background:var(--soft);display:flex}
.trk.l{justify-content:flex-end}
.trk i{display:block;height:6px;border-radius:3px;background:var(--acc)}
.trk.l i{background:var(--muted);opacity:.5}
.stp{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;align-items:center;gap:6px}
.stp button{width:44px;height:44px;flex-shrink:0;border:none;border-radius:14px;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.stp .c{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.stp input{width:100%;text-align:center;font-family:var(--f-d);font-size:32px;font-weight:800;line-height:1;border:none;background:transparent;color:var(--ink);padding:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp .pcv{font-family:var(--f-d);font-size:16px;font-weight:800;text-align:center;line-height:1.1;min-height:32px;display:flex;align-items:center}
.tog{flex:1;min-height:40px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tog.on{border-color:var(--acc);background:var(--acc);color:var(--onacc)}
.tog[disabled]{opacity:.4;cursor:not-allowed}
.rir{display:flex;align-items:center;gap:6px}
.rir .l{font-size:11px;font-weight:800;color:var(--muted);width:38px;line-height:1.15;flex-shrink:0}
.rir button{flex:1;min-width:0;height:46px;border-radius:13px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--f-d);font-size:18px;font-weight:800;cursor:pointer}
.rir button.meta{border-color:var(--acc)}
.rir button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.bottombar{position:fixed;left:0;right:0;bottom:var(--vb,0px);z-index:20;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(max(env(safe-area-inset-bottom,0px),16px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.bottombar .in{max-width:488px;margin:0 auto;display:flex;gap:8px}
.done{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--line)}
.done:first-of-type{border-top:none}
.ck{width:26px;height:26px;border-radius:13px;background:var(--okbg);color:var(--okfg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ck.w{background:var(--wbg);color:var(--wfg)}
.done .t{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px;font-weight:700}
.done .t small{font-size:11px;font-weight:600;color:var(--muted)}
.done .v{font-family:var(--f-d);font-size:17px;font-weight:800;text-align:right}
.mini-l{min-height:40px;border:none;background:none;color:var(--acc);font-size:13px;font-weight:800;cursor:pointer;padding:0 4px}
.tempo{background:var(--soft);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.tempo .t{font-family:var(--f-d);font-size:18px;font-weight:700;line-height:1.2}
.txt-in{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;padding:10px 12px}
textarea.txt-in{min-height:60px;resize:vertical}
.ring{position:relative;margin:0 auto}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bigt{display:flex;gap:10px}
.bigt>div{flex:1;background:var(--card);border-radius:22px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow)}
.bigt b{font-family:var(--f-d);font-size:68px;font-weight:800;color:var(--acc);line-height:1}
.prog{position:relative;height:14px;border-radius:7px;background:var(--soft)}
.prog i{display:block;height:14px;border-radius:7px;background:var(--acc)}
.prog u{position:absolute;top:-5px;width:3px;height:24px;background:var(--ink);border-radius:2px}
/* Hojas (sheets) */
.shov{position:fixed;inset:0;z-index:40;background:rgba(31,27,51,.45);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--card);border-radius:28px 28px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow-y:auto;box-shadow:0 -10px 30px rgba(20,10,60,.25);width:100%;max-width:520px;margin:0 auto}
.sheet .hd{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex-shrink:0}
.sheet .tt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt{width:100%;text-align:left;min-height:50px;padding:6px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;gap:8px;cursor:pointer}
.opt.on{border:2px solid var(--acc)}
.opt.dim{opacity:.6}
.opt .m{flex:1;min-width:0;display:flex;flex-direction:column}
.opt .m b{font-size:14px;font-weight:700}
.opt .m span{font-size:11px;color:var(--muted)}
.reco{border:3px solid var(--acc);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--soft);text-align:left;color:var(--ink);cursor:pointer;width:100%}
.reco.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--acc)}
.reco small{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--onacc);background:var(--acc);border-radius:6px;padding:2px 7px}
/* Progreso */
.recap{background:var(--recap);color:#FFFFFF;border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px}
.stk{font-family:var(--f-d);font-size:15px;font-weight:800;padding:6px 11px;border-radius:14px;display:inline-block}
.mb{display:flex;align-items:center;gap:8px;min-height:22px}
.mb .l{width:86px;font-size:13px;font-weight:700;flex-shrink:0}
.mb .tr{flex:1;height:10px;border-radius:5px;background:var(--soft)}
.mb .tr i{display:block;height:10px;border-radius:5px;background:#5B3DF5}
.mb .tr i.w{background:#C27A00}
.mb .v{width:62px;text-align:right;font-family:var(--f-d);font-size:13px;font-weight:700}
.cmp{display:flex;align-items:center;gap:6px;min-height:22px}
.cmp .a,.cmp .b{width:30px;font-family:var(--f-d);font-size:13px;font-weight:700}
.cmp .a{text-align:right;color:var(--muted)}
.cmp .n{width:78px;text-align:center;font-size:12px;font-weight:700}
.cmp .trk i{background:#5B3DF5}

/* ====== Fechas y utilidades ====== */
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function deIso(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function hoy(){return iso(new Date());}
function lunesDe(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function addDias(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function diaDe(d){return DIAS[d.getDay()];}
function fechaLarga(s){return deIso(s).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'short'});}
function fechaCorta(s){return deIso(s).toLocaleDateString('es-MX',{weekday:'short',day:'numeric'}).replace('.','');}
function capi(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return String(Math.round((+n||0)*100)/100);}
function mmss(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+pad(sec%60);}
function desc(d){return d>=60?(d%60?mmss(d)+' min':(d/60)+' min'):d+' s';}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;}
function nrm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
function limpio(s){return String(s||'').replace(/\s+/g,' ').trim();}

function swapVal(dk,ex){return S.swaps[dk+'.'+ex.id];}
function principal(dk,ex){var v=swapVal(dk,ex);if(typeof v==='string')return v;return opciones(ex)[v||0]||ex.n;}
function exPorId(dk,id){var t=R[dk];if(!t)return null;for(var i=0;i<t.ej.length;i++)if(t.ej[i].id===id)return t.ej[i];return null;}
function nSeries(it){return it&&it.series?it.series.length:0;}
function completo(ex,it){return ex.k==='cardio'?nSeries(it)>=1:nSeries(it)>=ex.s;}
function fechasDesc(){return Object.keys(S.ses).sort().reverse();}

function promedio(a){return a.length?Math.round(a.reduce(function(x,y){return x+y;},0)/a.length):null;}
function ultimoTs(s){var t=0;if(!s||!s.items)return 0;for(var k in s.items)(s.items[k].series||[]).forEach(function(x){if(x.ts>t)t=x.ts;});return t;}
function primerTs(s){var t=Infinity;if(!s||!s.items)return 0;for(var k in s.items)(s.items[k].series||[]).forEach(function(x){if(x.ts<t)t=x.ts;});return t===Infinity?0:t;}
function duracionMin(s){if(!s)return 0;var a=s.inicio||primerTs(s),b=s.estado==='hecha'&&s.fin?s.fin:(ultimoTs(s)||s.fin);return a&&b&&b>a?Math.round((b-a)/60000):0;}

/* ====== Migracion a v3.3 (se puede correr varias veces sin danar nada) ====== */
function migrar(){
 var cambio=false,habia=Object.keys(S.ses).length>0;
 if(!S.meta)S.meta={};
 if((S.meta.v||0)<33&&habia){
  try{if(!localStorage.getItem(LS+'-pre-v33'))localStorage.setItem(LS+'-pre-v33',JSON.stringify(datos()));}catch(e){}
  idbPut(JSON.parse(JSON.stringify(datos())),'pre-v33');
 }
 if(!S.gyms||!S.gyms.length){S.gyms=GYMS_DEF.map(function(g){return {id:g.id,n:g.n};});cambio=true;}
 // "Por lado" de cada serie con su nombre original (antes de unir nombres)
 fechasAsc().forEach(function(f){var s=S.ses[f];if(s.items)for(var k in s.items){var ex=exPorId(s.dia,k);if(!ex||ex.k==='cardio'||ex.k==='time')continue;(s.items[k].series||[]).forEach(function(x){if(x.lado===undefined&&!x.pc){x.lado=!!porLado(x.n);cambio=true;}});}});
 // Nombres: el primero conocido manda (rutina primero, luego historial en orden de fecha)
 var cm={};
 ORDEN.forEach(function(dk){R[dk].ej.forEach(function(ex){opciones(ex).forEach(function(o){var k=nrm(o);if(!cm[k])cm[k]=o;});});});
 function fija(n){if(!n)return n;var k=nrm(n);if(!cm[k]){cm[k]=limpio(n);return cm[k];}return cm[k];}
 fechasAsc().forEach(function(f){var s=S.ses[f];if(!s.items)return;for(var k in s.items){var it=s.items[k];(it.series||[]).forEach(function(x){var c=fija(x.n);if(c!==x.n){x.n=c;cambio=true;}});if(it.nombre){var c2=fija(it.nombre);if(c2!==it.nombre){it.nombre=c2;cambio=true;}}}});
 for(var sk in S.swaps)if(typeof S.swaps[sk]==='string'){var c3=fija(S.swaps[sk]);if(c3!==S.swaps[sk]){S.swaps[sk]=c3;cambio=true;}}
 [S.tempos,S.lados].forEach(function(obj){Object.keys(obj).forEach(function(k){var c4=fija(k);if(c4!==k){if(!obj.hasOwnProperty(c4))obj[c4]=obj[k];delete obj[k];cambio=true;}});});
 // Gym, semana de rutina y "por lado" de cada serie
 fechasAsc().forEach(function(f){var s=S.ses[f];
  if(!s.gym){s.gym='fc';cambio=true;}
  if(!s.sem&&R[s.dia]){var w=semCal(f);if(hechoEn(w,s.dia,f))w++;s.sem=Math.max(1,w);cambio=true;}
 });
 if((S.meta.v||0)<33){S.meta.v=33;if(habia)S.meta.migrado=hoy();cambio=true;}
 if(cambio)guardar();
 return cambio;
}

  subir.forEach(function(x){h+='<div class="row" style="flex-wrap:nowrap"><span class="nb" style="background:var(--okbg);color:var(--okfg)">'+ic('up',14,3)+'</span><span style="flex:1;font-weight:600;font-size:14px">'+esc(x.n)+'</span><span class="d num" style="font-size:16px;font-weight:700">'+esc(x.de)+'</span></div>';});
  h+='</div>';
  var ult=Object.keys(S.pesos).sort().pop();
  h+='<div class="card col"><h2 class="d" style="font-size:18px;font-weight:700">Peso corporal de hoy</h2><div class="note muted">En ayunas, después del baño, 3-4 veces por semana.'+(ult?' Último: '+fmt(S.pesos[ult])+' kg ('+esc(fechaCorta(ult))+').':'')+'</div><div class="row"><label class="sr" for="in-pc">Peso en kg</label><input class="inline-in num" id="in-pc" type="number" inputmode="decimal" step="0.1" placeholder="'+(ult?fmt(S.pesos[ult]):'59.1')+'" value="'+(S.pesos[hoy()]?fmt(S.pesos[hoy()]):'')+'"><span style="font-weight:700">kg</span><button type="button" class="btn2" data-act="pc">Guardar</button></div></div>';
 }else{
  var vp=volSem(w-1),mx=1;keys.forEach(function(m){mx=Math.max(mx,vol[m]||0,vp[m]||0);});
  h+='<div class="recap" style="flex-direction:row;align-items:center"><div style="flex:1;display:flex;flex-direction:column;align-items:center"><span style="font-size:10px;font-weight:800;letter-spacing:.1em;color:#C4BEDA">SEMANA '+(w-1>0?w-1:'—')+'</span><span class="d num" style="font-size:42px;font-weight:800;color:#C4BEDA;line-height:1">'+prev.series+'</span><span style="font-size:11px;color:#C4BEDA">series · '+hm(prev.min)+'</span></div><span style="font-size:12px;font-weight:800;color:#C4BEDA">vs</span><div style="flex:1;display:flex;flex-direction:column;align-items:center"><span style="font-size:10px;font-weight:800;letter-spacing:.1em;color:#C9BEFF">SEMANA '+w+'</span><span class="d num" style="font-size:42px;font-weight:800;line-height:1">'+st.series+'</span><span style="font-size:11px;color:#DCD6F2">series · '+hm(st.min)+'</span></div></div>';
  h+='<div class="card col"><div class="eb" style="text-align:center">Series por músculo</div>';
  keys.forEach(function(m){var a=vp[m]||0,b=vol[m]||0;h+='<div class="cmp"><span class="a num">'+f1(a)+'</span><span class="trk l"><i style="width:'+(a/mx*100).toFixed(0)+'%"></i></span><span class="n">'+MUS[m]+'</span><span class="trk"><i style="width:'+(b/mx*100).toFixed(0)+'%"></i></span><span class="b num">'+f1(b)+'</span></div>';});
  h+='</div>';
  var rec=recuperacion(null),ms=Object.keys(MUS).sort(function(a,b){return RANGO[rec[b].st]-RANGO[rec[a].st];});
  h+='<div class="card" style="padding:6px 14px 2px"><div class="d" style="font-size:17px;font-weight:700;padding:4px 0 6px">Recuperación ahora</div>';
  ms.forEach(function(m){var r=rec[m];h+='<div class="row" style="flex-wrap:nowrap;min-height:40px;border-top:1px solid var(--line)"><span style="flex:1;font-size:14px;font-weight:700">'+MUS[m]+'</span><span class="muted" style="font-size:12px">'+fmtH(r.h)+(r.fallo?' · fallo':'')+'</span>'+semChip(r.st)+'</div>';});
  h+='<div class="note muted" style="padding:8px 0">Grandes (pierna, pecho, espalda): listo a las 72 h, cuidado desde 48 h. Chicos (hombro, brazos, pantorrilla, abdomen): listo a las 48 h, cuidado desde 24 h. Si llegaste a RIR 0 se suman 24 h.</div></div>';
 }
 return h;
}
/* ====== Ajustes ====== */
function vAj(){
 var h='<div class="top"><h1 class="d" style="font-size:30px;font-weight:800">Ajustes</h1></div>',ult=S.cfg.lastBackup;
 h+='<div class="card note"><div class="eb" style="margin-bottom:4px">Guardado en el celular</div>Último guardado: <b>'+(savedAt?(function(){var d=Math.round((Date.now()-savedAt)/1000);return d<60?'hace '+d+' s':d<3600?'hace '+Math.round(d/60)+' min':new Date(savedAt).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});})():'sin datos aún')+'</b> · '+(idbOk?'en 2 lugares ✓':'en 1 lugar')+'</div>';
 h+='<div class="card col"><div class="eb">Respaldo de tus datos</div><div class="note">Tus registros viven en este celular. Respalda cada semana y guarda el archivo en tu carpeta <b>MichiFit\\05_Respaldos_datos</b>.<br>Último respaldo: <b>'+(ult?esc(fechaLarga(ult)):'nunca')+'</b></div><div class="row"><button type="button" class="btn2" data-act="respaldar">Respaldar ahora</button><button type="button" class="btn2" data-act="importar">Restaurar desde archivo</button></div>';
 if(S.imp)h+='<div class="conf" role="alert"><div>El archivo <b>'+esc(S.imp.nombre)+'</b> trae <b>'+S.imp.n+' entrenamientos</b>. Los días que ya tengas se reemplazan con los del archivo.</div><div class="row"><button type="button" class="btn2" data-act="imp-si">Restaurar</button><button type="button" class="btn2" data-act="imp-no">Cancelar</button></div></div>';
 h+='</div>';
 h+='<div class="card col"><div class="eb">Gyms</div>';S.gyms.forEach(function(g){var n=Object.keys(S.ses).filter(function(f){return gymDe(S.ses[f])===g.id;}).length;h+='<div class="row" style="flex-wrap:nowrap"><span style="flex:1"><b>'+esc(g.n)+'</b><br><span class="muted" style="font-size:12px">'+n+' entrenos'+(g.id===gymDef()?' · el de siempre':'')+'</span></span>'+(g.id===gymDef()?semChip('ok','Predeterminado'):'<button type="button" class="chip" data-act="gym-def" data-v="'+g.id+'">Hacer predeterminado</button>')+'</div>';});h+='<button type="button" class="btn2" data-act="gym-sheet">'+ic('plus',16)+'Agregar gym</button></div>';
 h+='<div class="card col"><div class="eb">Tema</div><div class="seg">';[['light','Claro'],['dark','Oscuro'],['sistema','Sistema']].forEach(function(t){h+='<button type="button" class="'+(S.cfg.theme===t[0]?'on':'')+'" data-act="tema" data-v="'+t[0]+'">'+t[1]+'</button>';});h+='</div></div>';
 h+='<div class="card col"><div class="eb">Temporizador del iPhone</div><button type="button" class="switch" data-act="atajo" role="switch" aria-checked="'+!!S.cfg.atajo+'"><span style="font-weight:700">Iniciar el temporizador del iPhone en cada descanso</span><span class="chip'+(S.cfg.atajo?' on':'')+'">'+(S.cfg.atajo?'Activado':'Apagado')+'</span></button><div class="note muted">Necesita el atajo <b>"'+ATAJO+'"</b> en la app Atajos. Al guardar cada serie se abre Atajos un momento; regresa con "◀ MichiFit".</div><button type="button" class="btn2" data-act="probar-atajo">Probar atajo (10 s)</button></div>';
 var sw=Object.keys(S.swaps);
 h+='<div class="card col"><div class="eb">Mi rutina · cambios guardados</div>';
 if(!sw.length)h+='<div class="note muted">Sin cambios. Cuando elijas un ejercicio "Desde ahora", aparecerá aquí.</div>';
 sw.forEach(function(k){var p=k.split('.'),ex=exPorId(p[0],p[1]);if(!ex)return;h+='<div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><div style="font-weight:700">'+CORTO[p[0]]+' · '+esc(principal(p[0],ex))+'</div><div class="muted" style="font-size:12px">en lugar de '+esc(ex.n)+'</div></div><button type="button" class="chip" data-act="restaurar-ej" data-v="'+esc(k)+'">Restaurar</button></div>';});
 h+='</div>';
 h+='<div class="card col"><div class="eb">Sonidos</div><div class="note">Siempre están activos dentro de la app: guardar serie, fin del descanso, meta del cronómetro y avisos.</div><button type="button" class="btn2" data-act="probar">Probar sonido</button></div>';
 h+='<div class="card note"><div class="eb" style="margin-bottom:4px">Programa</div>Rutina Nov-Dic 2026 · inicio lunes 2 nov · semana de rutina '+semBase()+' de '+SEMANAS+'.<br>RIR meta: semanas 1-2 → 2-3; semanas 3-9 → 1-2; sábado siempre 2-3.<br>Descanso al cambiar de ejercicio: '+mmss(TRANS)+'.'+(S.meta&&S.meta.migrado?'<br>Datos actualizados a v3.3 el '+esc(fechaLarga(S.meta.migrado))+'.':'')+'<br>MichiFit '+VER+(ENV==='qa'?' QA':'')+'</div>';
 return h;
}
/* ====== Descanso, fin y navegacion ====== */
function vRest(){
 var r=S.rest,rem=(r.fin-Date.now())/1000,al=rem<=0,C=628.3,fr=Math.max(0,Math.min(1,rem/r.total));
 var h='<div class="ov'+(al?' alarma':'')+'" role="dialog" aria-label="Descanso"><div class="inner">';
 h+='<div class="alert ok" style="width:100%">'+ic('chk',16,3)+'<span>'+esc(r.titulo)+'</span></div>';
 h+='<div class="eb" style="'+(al?'color:inherit':'')+'">'+(al?'¡Se acabó el descanso!':r.done?'Cambio de ejercicio':'Descanso')+'</div>';
 h+='<div class="ring" style="width:230px;height:230px"><svg width="230" height="230" viewBox="0 0 230 230" aria-hidden="true"><circle cx="115" cy="115" r="100" fill="'+(al?'#FFE3EC':'var(--card)')+'" stroke="'+(al?'#D9466F':'var(--soft)')+'" stroke-width="16"/><circle id="rt-ring" cx="115" cy="115" r="100" fill="none" stroke="'+(al?'#2A0A18':'var(--acc)')+'" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-fr))+'" transform="rotate(-90 115 115)"/></svg><div class="c"><div class="tm rtime" style="'+(al?'color:#2A0A18':'')+'">'+(al?'+'+mmss(-rem):mmss(Math.ceil(rem)))+'</div><div style="font-weight:600;'+(al?'color:#2A0A18':'color:var(--muted)')+'">'+(al?'tiempo extra':'de '+mmss(r.total))+'</div></div></div>';
 h+='<div class="row" style="flex-wrap:nowrap;align-items:flex-end">'+michi(al?'banda':'agua',96)+'<div class="alert ok" style="margin-bottom:52px;background:#FFFFFF;color:#1F1B33">'+(al?'¡Vamos, bro!':'Respira y toma agua')+'</div></div>';
 if(r.sug)h+='<div class="alert '+(r.sug.indexOf('sube')>=0?'ok':r.sug.indexOf('baja')>=0?'w':'ok')+'">'+esc(r.sug)+'</div>';
 h+='<div class="grid3"><button type="button" class="btn2" data-act="rest-menos">−15 s</button><button type="button" class="btn2" data-act="rest-mas">+15 s</button><button type="button" class="btn" data-act="rest-voy" style="min-height:50px">Voy</button></div>';
 h+='<div class="next"><div class="eb" style="color:rgba(255,255,255,.85)">'+(r.done?'Siguiente ejercicio':'Siguiente')+'</div><div class="d" style="font-size:23px;font-weight:800">'+esc(r.sig)+'</div>'+(r.meta?'<div style="opacity:.9;font-size:14px">'+esc(r.meta)+'</div>':'')+(r.despues?'<div style="margin-top:6px;font-size:14px;font-weight:600">Después: '+esc(r.despues)+'</div>':'')+'</div>';
 h+='<button type="button" class="btn2 w" data-act="rest-min">'+(r.done&&r.nxIdx!=null?'Ver siguiente ejercicio':'Ver ejercicio')+' (el tiempo sigue corriendo)</button>';
 return h+'</div></div>';
}
function vMini(){
 var r=S.rest,rem=(r.fin-Date.now())/1000,al=rem<=0;
 return '<div class="mini'+(al?' alarma':'')+'"><div class="in"><button type="button" class="exp" data-act="rest-max" aria-label="Ver descanso en pantalla completa"><span class="tm rtime">'+(al?'+'+mmss(-rem):mmss(Math.ceil(rem)))+'</span><span style="font-size:13px;font-weight:700;line-height:1.2;min-width:0">'+(al?'¡A la siguiente!':'Descanso')+'<br><span style="font-weight:500">Toca para ampliar</span></span>'+ic('exp',18,2.4)+'</button><button type="button" class="sm" data-act="rest-menos" aria-label="Quitar 15 segundos">−15</button><button type="button" class="sm" data-act="rest-mas" aria-label="Agregar 15 segundos">+15</button><button type="button" class="voy" data-act="rest-voy">Voy</button></div></div>';
}
function vFin(){
 var f=S.fin,h='<div class="ov" role="dialog" aria-label="Entrenamiento terminado"><div class="inner">'+michi('fiesta',170)+'<h1 class="d" style="font-size:38px;font-weight:800;text-align:center">¡Entrenamiento terminado!</h1>';
 h+='<div class="tiles" style="margin-top:0;width:100%;flex-wrap:wrap"><div class="tile"><div class="v">'+f.dur+'<small> min</small></div><div class="l">Duración</div></div><div class="tile"><div class="v">'+f.series+'</div><div class="l">Series</div></div>'+(f.dsc!=null?'<div class="tile"><div class="v">'+mmss(f.dsc)+'</div><div class="l">Descanso prom.</div></div>':'')+'</div>';
 if(f.recs.length){h+='<div class="card" style="width:100%"><div class="eb" style="margin-bottom:6px">Récords nuevos</div>';f.recs.forEach(function(r){h+='<div style="font-weight:700">'+esc(r)+'</div>';});h+='</div>';}
 return h+'<button type="button" class="btn" data-act="fin-cerrar">Cerrar</button></div></div>';
}
function nav(){
 var it=[['inicio','Inicio','hoy'],['hist','Historial','hist'],['prog','Progreso','prog'],['aj','Ajustes','aj']],cur=S.view==='ej'||S.view==='hoy'?'inicio':S.view,h='<nav class="bar" aria-label="Secciones"><div class="in">';
 it.forEach(function(x){h+='<button type="button" class="'+(cur===x[0]?'on':'')+'" data-act="nav" data-v="'+x[0]+'"'+(cur===x[0]?' aria-current="page"':'')+'>'+ic(x[2],23,cur===x[0]?2.4:2)+x[1]+'</button>';});
 return h+'</div></nav>';
}
function render(){
 MID=0;
 if((S.view==='hoy'||S.view==='ej')&&!R[S.dia])S.view='inicio';
 var v=S.view,body=v==='ej'?vEj():v==='hoy'?vHoy():v==='hist'?vHist():v==='prog'?vProg():v==='aj'?vAj():vInicio();
 var h=(ENV==='qa'?'<div class="qa" role="note">QA · PRUEBAS · datos de prueba</div>':'')+'<main class="wrap'+(v==='ej'?' ej':'')+'">'+body+'</main>'+(v==='ej'?'':nav());
 if(S.rest)h+=S.rest.min?vMini():vRest();
 h+=vSheet();
 if(S.fin)h+=vFin();
 if(S.toast)h+='<div class="toast'+(S.toast.kind==='err'?' err':S.toast.kind==='warn'?' warn':'')+'" role="status">'+esc(S.toast.msg)+'</div>';
 var app=document.getElementById('app'),a=document.activeElement,fid=a&&a.id;
 if(fid==='in-nota'||fid==='in-otro'||fid==='ed-peso'||fid==='ed-reps'||fid==='ed-min'||fid==='in-tempo'||fid==='in-gym'||fid==='in-pc')return;
 app.setAttribute('style',colVars(v==='hoy'||v==='ej'?S.dia:'lun'));
 app.innerHTML=h;
 if(fid){var el=document.getElementById(fid);if(el&&el.tagName==='INPUT')el.focus();}
 tick();
}

cargar();
setTimeout(ajustaVista,400);
if(!S.gymSel)S.gymSel=S.cfg.gym||'fc';
migrar();aplicarTema();initDia();render();
idbAbrir(function(db){if(!db)return;idbGet(function(d){if(d&&(d.savedAt||0)>savedAt){ponerDatos(d);savedAt=d.savedAt;try{localStorage.setItem(LS,JSON.stringify(d));}catch(e){}S.draft={};migrar();initDia();render();}else if(savedAt||Object.keys(S.ses).length){guardar();}else idbOk=true;});});
window.addEventListener('pagehide',function(){if(savedAt)guardar();});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
