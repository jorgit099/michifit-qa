<title>MichiFit QA</title>
<!--
  MichiFit v3.1 · 2026-11-04
  Cambios respecto a v3:
  - "Siguiente" = el primer ejercicio pendiente de arriba hacia abajo (regresa a los que te saltaste).
  - "La vez pasada" muestra cualquier variante del ejercicio si la de hoy no tiene historial (con etiqueta).
  - Guardado doble: localStorage + IndexedDB; al abrir se usa la copia mas reciente. "Ultimo guardado" en Ajustes.
  Cambios de v3 respecto a v2:
  - Corregido: el tiempo de descanso ya no aparece repetido en la lista de ejercicios.
  - Orden libre: "Siguiente" lleva al siguiente ejercicio PENDIENTE (nunca a uno terminado);
    aviso "Ir al pendiente" en ejercicios completos y confirmacion antes de una serie extra.
  - Peso corporal: boton para registrar series sin kilos (activado por defecto en elevaciones, plancha, paralelas, dominadas).
  - Editar series: corregir peso, reps y RIR (o borrar) hoy y desde Historial.
  - Ambiente QA: misma app con datos y cache separados y franja "QA · PRUEBAS".
  Cambios de v2 respecto a v1:
  - Ahora es una PWA propia (index.html + manifest + service worker): se instala desde Safari y funciona sin internet.
  - Datos guardados en el celular, con botones Respaldar (archivo .json) y Restaurar.
  - Paleta D1 lavanda y violeta (tema claro por defecto; oscuro opcional).
  - Descanso: muestra siempre el siguiente ejercicio, se puede minimizar a una barra, y "Guardar" queda bloqueado hasta tocar "Voy".
  - Descanso de transicion fijo de 3:00 al terminar un ejercicio.
  - Tiempos: duracion (Empezar -> Terminar), tiempo de cada serie y descanso real por serie.
  - Sugerencia de peso entre series segun RIR y reps.
  - Notas por ejercicio y opcion "Otro ejercicio..." (solo hoy / desde ahora).
  - Pantorrilla: lunes extension de pantorrilla sentado; jueves costurera.
  - Opcion de iniciar el temporizador nativo del iPhone con un atajo (suena y se ve en la pantalla bloqueada).
-->

/* ====== Fechas y utilidades ====== */
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function deIso(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function hoy(){return iso(new Date());}
function lunesDe(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function addDias(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function semana(){return Math.max(1,Math.floor((lunesDe(new Date())-deIso(START))/(7*864e5))+1);}
function diaDe(d){return DIAS[d.getDay()];}
function fechaLarga(s){return deIso(s).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'short'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return String(Math.round((+n||0)*100)/100);}
function mmss(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+pad(sec%60);}
function desc(d){return d>=60?(d%60?mmss(d)+' min':(d/60)+' min'):d+' s';}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;}

function principal(dk,ex){var v=swapVal(dk,ex);if(typeof v==='string')return v;return opciones(ex)[v||0]||ex.n;}

function itemHoy(ex){var s=S.ses[hoy()];return s&&s.dia===S.dia&&s.items?s.items[ex.id]:null;}
function nombreDe(dk,ex){var s=S.ses[hoy()];var it=s&&s.dia===dk&&s.items&&s.items[ex.id];if(it&&it.nombre)return it.nombre;return principal(dk,ex);}

function completo(ex,it){return ex.k==='cardio'?nSeries(it)>=1:nSeries(it)>=ex.s;}
function fechasDesc(){return Object.keys(S.ses).sort().reverse();}
function historial(nombre,incluirHoy){var f0=hoy(),fs=fechasDesc();for(var i=0;i<fs.length;i++){var f=fs[i];if(!incluirHoy&&f===f0)continue;var s=S.ses[f];if(!s||!s.items)continue;for(var k in s.items){var it=s.items[k];var ser=(it.series||[]).filter(function(x){return x.n===nombre;});if(ser.length)return {fecha:f,series:ser,nota:it.nombre===nombre?it.nota:''};}}return null;}
function historialSlot(exId,incluirHoy){var f0=hoy(),fs=fechasDesc();for(var i=0;i<fs.length;i++){var f=fs[i];if(!incluirHoy&&f===f0)continue;var s=S.ses[f],it=s&&s.items&&s.items[exId];if(it&&it.series&&it.series.length){var nm=it.series[it.series.length-1].n;return {fecha:f,series:it.series.filter(function(x){return x.n===nm;}),nombre:nm};}}return null;}

 var ss=h.series,allTop=ss.length>=ex.s&&ss.every(function(x){return (+x.r||0)>=hi;}),easy=ss.every(function(x){return x.rir!=null&&x.rir>=4;}),fail=ss.some(function(x){return x.rir===0&&(+x.r||0)<lo;});

 if(allTop||easy){var np=Math.max(0,p+inc*dir);return {tipo:'sube',peso:np,texto:(ex.asist?'Menos asistencia: prueba ':easy&&!allTop?'Te sobraba fuerza: sube a ':'Todas al tope: hoy prueba ')+fmt(np)+' kg.'};}
 if(fail){var bp=Math.max(0,p-inc*dir);return {tipo:'baja',peso:bp,texto:'Se complicó la vez pasada: '+(ex.asist?'más asistencia, ':'baja a ')+fmt(bp)+' kg y cuida la técnica.'};}

}
function entreSeries(ex,x){
 if(ex.k!=='w'||x.pc)return null;var lo=ex.r[0],inc=ex.inc||2.5,dir=ex.asist?-1:1,p=+x.p||0;
 if(x.rir!=null&&x.rir>=4)return {peso:Math.max(0,p+inc*dir),txt:'Te sobraban 4 o más: sube un escalón.'};
 if(x.rir===0&&(+x.r||0)<lo)return {peso:Math.max(0,p-inc*dir),txt:'No llegaste al mínimo: baja un escalón.'};

}
function draft(ex){
 var d=S.draft[ex.id];if(d)return d;
 var it=itemHoy(ex),nom=nombreDe(S.dia,ex),h=historial(nom,false),sg=sugerir(ex,h,rirMeta(S.dia));

 else if(h)d={peso:sg&&sg.peso!=null?sg.peso:h.series[0].p,reps:h.series[0].r,rir:null,min:ex.r[0],pc:h.series.every(function(x){return x.pc;})};

function ultimoTs(s){var t=0;if(!s||!s.items)return 0;for(var k in s.items)(s.items[k].series||[]).forEach(function(x){if(x.ts>t)t=x.ts;});return t;}
function primerTs(s){var t=Infinity;if(!s||!s.items)return 0;for(var k in s.items)(s.items[k].series||[]).forEach(function(x){if(x.ts<t)t=x.ts;});return t===Infinity?0:t;}
function duracionMin(s){if(!s)return 0;var a=s.inicio||primerTs(s),b=s.estado==='hecha'&&s.fin?s.fin:(ultimoTs(s)||s.fin);return a&&b&&b>a?Math.round((b-a)/60000):0;}

function exPorId(dk,id){var t=R[dk];if(!t)return null;for(var i=0;i<t.ej.length;i++)if(t.ej[i].id===id)return t.ej[i];return null;}
function promedio(a){return a.length?Math.round(a.reduce(function(x,y){return x+y;},0)/a.length):null;}
